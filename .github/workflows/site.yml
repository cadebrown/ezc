name: Deploy site

# Build the docs site and deploy to GitHub Pages. Triggered on push to main
# when site/, crates/ezc-web/, std/, or this workflow itself changes — and
# manually via workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/ezc-web/**"
      - "crates/ezc/**"
      - "std/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# GitHub Pages requires these permissions to publish, plus the `id-token`
# claim for the deploy step. Concurrency is set to "pages" with cancel-in-
# progress=false so we don't kill an in-flight production deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: build site
        run: bash site/build.sh
      - name: configure pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages on first run if not already configured.
          # Requires the workflow's `pages: write` permission (set above).
          enablement: true
      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/book/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
