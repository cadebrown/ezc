name: Release

# Tag-driven release: pushing a `vX.Y.Z` tag builds binaries for every
# supported platform and attaches them to a GitHub Release.
#
# Tag and push:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# To dry-run without creating an actual release, dispatch manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-26-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build binaries
        run: cargo build --release --target ${{ matrix.target }} -p ezc-cli -p ezc-lsp -p ezc-dap

      - name: package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          NAME="ezc-${{ github.ref_name }}-${{ matrix.target }}"
          STAGE="dist/$NAME"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/ezc "$STAGE/"
          cp target/${{ matrix.target }}/release/ezc-lsp "$STAGE/"
          cp target/${{ matrix.target }}/release/ezc-dap "$STAGE/"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          cp -r std "$STAGE/" 2>/dev/null || true
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"

      - name: package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "ezc-${{ github.ref_name }}-${{ matrix.target }}"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage
          Copy-Item "target/${{ matrix.target }}/release/ezc.exe" $stage
          Copy-Item "target/${{ matrix.target }}/release/ezc-lsp.exe" $stage
          Copy-Item "target/${{ matrix.target }}/release/ezc-dap.exe" $stage
          if (Test-Path "README.md") { Copy-Item "README.md" $stage }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" $stage }
          if (Test-Path "std") { Copy-Item -Recurse "std" $stage }
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezc-${{ matrix.target }}
          path: dist/ezc-*.${{ matrix.archive }}
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect into single dir
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          ls -la dist/

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
